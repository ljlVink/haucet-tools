[workspace]
members = [
    "crates/common",
    "crates/cli",
    "crates/gui",
    "crates/hm-fastboot"
]
default-members = [
    "crates/cli",
    "crates/gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.32"
flate2 = { version = "1", features = ["zlib-rs"] }
hex = "0.4"
libc = "0.2"
lz4 = "1.28"
lzma-rust2 = { version = "0.1", features = ["encoder"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1.3"
zip = { version = "4", default-features = false, features = ["deflate"] }
