[package]
name = "haucet-tools"
version = "0.1.0"
edition = "2024"
description = "Rust tools for unpacking and repacking Huawei update, EROFS, and ramdisk images"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
ramdisk-tools = { git = "https://github.com/ljlVink/ramdisk-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1.3"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
