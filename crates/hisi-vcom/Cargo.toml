[package]
name = "hisi-vcom"
version = "0.1.0"
edition = "2021"
description = "HiSilicon / Huawei Kirin bootrom VCOM loader upload in pure Rust (nusb)"
license = "MIT OR Apache-2.0"
keywords = ["huawei", "kirin", "hisilicon", "vcom", "usb"]
categories = ["hardware-support", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
nusb = "0.2.7"
serialport.workspace = true
thiserror = "2.0.20"
