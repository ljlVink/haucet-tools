[package]
name = "gui"
version.workspace = true
edition.workspace = true
description = "egui desktop interface for haucet-tools"
license.workspace = true

[[bin]]
name = "haucet-tools-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
common = { path = "../common" }
eframe.workspace = true
egui.workspace = true
egui_extras = { version = "0.32", default-features = false, features = ["image"] }
hisi-vcom = { path = "../hisi-vcom" }
hm-fastboot = { path = "../hm-fastboot" }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
winresource = { version = "0.1", default-features = false }

# The X11 backend only exists on Unix; on Windows eframe uses its native
# (WGL/OpenGL via glow) backend.
[target.'cfg(unix)'.dependencies]
eframe = { workspace = true, features = ["x11"] }
